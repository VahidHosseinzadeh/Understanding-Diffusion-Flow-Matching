[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dfm"
version = "0.2.0"
description = "Flow matching from scratch, factored into path / target / sampler axes (EDM-style)."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
# pip install -e ".[tracking]"  -- the package runs fine without it
tracking = ["wandb>=0.16"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
